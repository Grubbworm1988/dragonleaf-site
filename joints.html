<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wrong Joints</title>
  <style>
    :root {
      --bg: #12100d;
      --card: #1c1914;
      --ink: #e8e0d2;
      --mute: #9a8f7e;
      --leaf: #7a9a6a;
      --warn: #c4a15a;
      --stiff: #b5684a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
    }
    header, .bar, .stage, footer {
      max-width: 28rem;
      margin: 0 auto;
      padding: 0 1.1rem;
    }
    header { padding-top: 1.1rem; }
    h1 { font-size: 1.35rem; margin: 0 0 .3rem; font-weight: 600; }
    .sub { margin: 0; color: var(--mute); font-size: .95rem; line-height: 1.4; }
    .bar { display: flex; gap: .4rem; flex-wrap: wrap; padding-top: .85rem; }
    button {
      font: inherit;
      font-size: .85rem;
      background: var(--card);
      color: var(--ink);
      border: 1px solid #2c261e;
      padding: .4rem .65rem;
      cursor: pointer;
    }
    button.on { border-color: var(--leaf); color: var(--leaf); }
    button:disabled { opacity: .45; cursor: default; }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      margin-top: .75rem;
      background: var(--card);
      border: 1px solid #2c261e;
      touch-action: none;
    }
    .note {
      margin: .75rem 0 0;
      min-height: 4.6rem;
      padding: .8rem .9rem;
      background: var(--card);
      border: 1px solid #2c261e;
    }
    .note b { color: var(--warn); font-weight: 600; }
    .note p { margin: .3rem 0 0; color: var(--mute); line-height: 1.4; }
    footer { padding: 1rem 1.1rem 2rem; color: #6d6558; font-size: .78rem; }
  </style>
</head>
<body>
  <header>
    <h1>Wrong Joints</h1>
    <p class="sub">Pins on the hinges. Pull one and that bend goes stiff. The animal still has to try.</p>
  </header>
  <div class="bar">
    <button id="pull" class="on">pull pin</button>
    <button id="add">add joint</button>
    <button id="try">try</button>
    <button id="reset">reset giraffe</button>
  </div>
  <div class="stage">
    <canvas id="c" width="360" height="280"></canvas>
    <div class="note" id="note"></div>
  </div>
  <footer>Dragonleaf experiment. Wrong Joints. Not a catalog.</footer>
  <script>
(function () {
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const noteEl = document.getElementById("note");
  const btnPull = document.getElementById("pull");
  const btnAdd = document.getElementById("add");
  const btnTry = document.getElementById("try");
  const btnReset = document.getElementById("reset");

  const LEAF = { x: 310, y: 28 };

  const DEFS = [
    { id: "neck", name: "neck", site: "neck", parent: "body", rest: -1.35, min: -2.4, max: -0.2, len: 78, ax: 48, ay: -8 },
    { id: "head", name: "skull", site: "skull", parent: "neck", rest: -0.15, min: -1.1, max: 0.9, len: 34 },
    { id: "fl_hip", name: "front left hip", site: "shoulder", parent: "body", rest: 1.45, min: 0.4, max: 2.5, len: 42, ax: 36, ay: 10 },
    { id: "fl_knee", name: "front left knee", site: "knee", parent: "fl_hip", rest: 0.35, min: -0.2, max: 1.6, len: 48 },
    { id: "fr_hip", name: "front right hip", site: "shoulder", parent: "body", rest: 1.55, min: 0.4, max: 2.5, len: 42, ax: 28, ay: 12 },
    { id: "fr_knee", name: "front right knee", site: "knee", parent: "fr_hip", rest: 0.4, min: -0.2, max: 1.6, len: 48 },
    { id: "bl_hip", name: "back left hip", site: "hip", parent: "body", rest: 1.7, min: 0.6, max: 2.7, len: 42, ax: -28, ay: 10 },
    { id: "bl_knee", name: "back left knee", site: "knee", parent: "bl_hip", rest: 0.25, min: -0.3, max: 1.5, len: 48 },
    { id: "br_hip", name: "back right hip", site: "hip", parent: "body", rest: 1.8, min: 0.6, max: 2.7, len: 42, ax: -36, ay: 10 },
    { id: "br_knee", name: "back right knee", site: "knee", parent: "br_hip", rest: 0.3, min: -0.3, max: 1.5, len: 48 }
  ];

  let mode = "pull";
  let trying = false;
  let animId = null;
  let drag = null;
  let worldX = 0;
  let joints = [];
  let extras = [];
  let body = { x: 130, y: 130 };
  let pendingPull = null;

  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  function allJoints() { return joints.concat(extras); }

  function byId(id) { return allJoints().find(j => j.id === id); }

  function setNote(title, line) {
    noteEl.innerHTML = "<b>" + title + "</b><p>" + line + "</p>";
  }

  function setMode(m) {
    mode = m;
    btnPull.classList.toggle("on", m === "pull");
    btnAdd.classList.toggle("on", m === "add");
    btnTry.disabled = trying;
  }

  function resetAll() {
    joints = DEFS.map(d => Object.assign({}, d, {
      angle: d.rest, stiff: false, live: true, present: true
    }));
    extras = [];
    body = { x: 130, y: 130 };
    worldX = 0;
    drag = null;
    pendingPull = null;
    trying = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    setMode("pull");
    setNote("stock giraffe", "Pull a pin to lock a bend. Add restores a stiff pin or puts a hinge where one does not belong. Try makes it walk and graze.");
    draw();
  }

  function pose() {
    const map = {};
    const originBody = { x: body.x + worldX, y: body.y };

    function place(j) {
      if (map[j.id]) return map[j.id];
      let ox, oy;
      if (j.parent === "body") {
        ox = originBody.x + (j.ax || 0);
        oy = originBody.y + (j.ay || 0);
      } else {
        const p = place(byId(j.parent));
        ox = p.tipX; oy = p.tipY;
      }
      const tipX = ox + Math.cos(j.angle) * j.len;
      const tipY = oy + Math.sin(j.angle) * j.len;
      map[j.id] = { pinX: ox, pinY: oy, tipX: tipX, tipY: tipY };
      return map[j.id];
    }
    for (const j of allJoints()) place(j);
    return map;
  }

  function hitPin(x, y, posed) {
    let best = null, bestD = 16 * 16;
    for (const j of allJoints()) {
      if (!j.present) continue;
      const p = posed[j.id];
      const d = (x - p.pinX) * (x - p.pinX) + (y - p.pinY) * (y - p.pinY);
      if (d <= bestD) { bestD = d; best = j; }
    }
    return best;
  }

  function distSeg(px, py, x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1;
    const l2 = dx * dx + dy * dy || 1;
    let t = ((px - x1) * dx + (py - y1) * dy) / l2;
    t = Math.max(0, Math.min(1, t));
    return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
  }

  function hitShaft(x, y, posed) {
    let best = null, bestD = 16;
    for (const j of allJoints()) {
      if (!j.present) continue;
      const p = posed[j.id];
      const d = distSeg(x, y, p.pinX, p.pinY, p.tipX, p.tipY);
      if (d < bestD) { bestD = d; best = j; }
    }
    return best;
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
    ctx.fill();
  }

  function drawSeg(posed, j, color, width) {
    const p = posed[j.id];
    if (!p) return;
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(p.pinX, p.pinY);
    ctx.lineTo(p.tipX, p.tipY);
    ctx.stroke();
  }

  function draw() {
    const posed = pose();
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#2a241c";
    ctx.fillRect(0, 252, canvas.width, 28);

    ctx.fillStyle = "#3a5034";
    ctx.fillRect(LEAF.x - 2, LEAF.y + 8, 4, 244);
    ctx.fillStyle = "#7a9a6a";
    ctx.beginPath();
    ctx.ellipse(LEAF.x, LEAF.y, 14, 10, -0.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#9ab888";
    ctx.beginPath();
    ctx.ellipse(LEAF.x + 8, LEAF.y + 4, 9, 6, 0.5, 0, Math.PI * 2);
    ctx.fill();

    const bx = body.x + worldX, by = body.y;

    drawSeg(posed, byId("br_hip"), "#a89870", 10);
    drawSeg(posed, byId("br_knee"), "#a89870", 9);
    drawSeg(posed, byId("bl_hip"), "#c4b89a", 10);
    drawSeg(posed, byId("bl_knee"), "#c4b89a", 9);

    ctx.fillStyle = "#b89a62";
    roundRect(bx - 52, by - 18, 108, 36, 8);

    drawSeg(posed, byId("fr_hip"), "#a89870", 10);
    drawSeg(posed, byId("fr_knee"), "#a89870", 9);
    drawSeg(posed, byId("fl_hip"), "#c4b89a", 10);
    drawSeg(posed, byId("fl_knee"), "#c4b89a", 9);

    drawSeg(posed, byId("neck"), "#c4b07a", 12);
    const head = byId("head");
    const hp = posed[head.id];
    ctx.fillStyle = "#e2d2a4";
    ctx.beginPath();
    ctx.ellipse(hp.tipX, hp.tipY, 18, 11, head.angle, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#c4b89a";
    ctx.beginPath();
    ctx.ellipse(
      hp.tipX + Math.cos(head.angle) * 16,
      hp.tipY + Math.sin(head.angle) * 16,
      10, 5, head.angle, 0, Math.PI * 2
    );
    ctx.fill();

    for (const e of extras) {
      if (e.present) drawSeg(posed, e, "#8a7a5c", 7);
    }

    for (const j of allJoints()) {
      if (!j.present) continue;
      const p = posed[j.id];
      ctx.beginPath();
      ctx.arc(p.pinX, p.pinY, 7, 0, Math.PI * 2);
      ctx.fillStyle = (j.stiff || !j.live) ? "#b5684a" : "#7a9a6a";
      ctx.fill();
      if (j.site === "extra") {
        ctx.strokeStyle = "#c4a15a";
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
    }
  }

  function local(ev) {
    const r = canvas.getBoundingClientRect();
    const t = ev.changedTouches ? ev.changedTouches[0] : ev;
    return {
      x: (t.clientX - r.left) * (canvas.width / r.width),
      y: (t.clientY - r.top) * (canvas.height / r.height)
    };
  }

  function stiffen(j) {
    j.stiff = true;
    j.live = false;
    setNote(j.name + " locked", "Bend is stiff. Part stays on. Try a walk if you want the invoice.");
    draw();
  }

  function restore(j) {
    j.stiff = false;
    j.live = true;
    setNote(j.name + " live", "Hinge restored. Drag the pin to bend it.");
    draw();
  }

  function addExtraOn(parent) {
    const id = "extra_" + extras.length + "_" + Date.now().toString(36);
    const half = parent.len * 0.5;
    const oldLen = parent.len;
    parent.len = half;
    const child = {
      id: id,
      name: "extra hinge on " + parent.name,
      site: "extra",
      parent: parent.id,
      rest: 0.4,
      min: -1.2,
      max: 1.4,
      len: oldLen - half,
      angle: parent.angle + 0.5,
      stiff: false,
      live: true,
      present: true
    };
    for (const o of allJoints()) {
      if (o.id !== id && o.parent === parent.id) o.parent = id;
    }
    extras.push(child);
    setNote("extra hinge", "Nature did not order this. Try will fold it in a stupid place.");
    draw();
  }

  function onDown(ev) {
    if (trying) return;
    ev.preventDefault();
    canvas.setPointerCapture(ev.pointerId);
    const pt = local(ev);
    const posed = pose();
    const pin = hitPin(pt.x, pt.y, posed);

    if (mode === "pull") {
      if (pin) {
        pendingPull = { id: pin.id, x: pt.x, y: pt.y, moved: false };
        if (pin.live && !pin.stiff) {
          drag = { id: pin.id };
        }
      }
      return;
    }

    if (mode === "add") {
      if (pin && (pin.stiff || !pin.live)) {
        restore(pin);
        return;
      }
      const shaft = hitShaft(pt.x, pt.y, posed);
      if (shaft) {
        addExtraOn(shaft);
        return;
      }
      setNote("missed", "Tap a stiff pin to restore, or a bone shaft to add a hinge.");
      return;
    }

    if (pin && pin.live && !pin.stiff) {
      drag = { id: pin.id };
    }
  }

  function onMove(ev) {
    if (trying) return;
    const pt = local(ev);
    if (pendingPull) {
      const dx = pt.x - pendingPull.x, dy = pt.y - pendingPull.y;
      if (dx * dx + dy * dy > 25) pendingPull.moved = true;
    }
    if (!drag) return;
    ev.preventDefault();
    const j = byId(drag.id);
    if (!j || j.stiff || !j.live) return;
    const posed = pose();
    const p = posed[j.id];
    j.angle = clamp(Math.atan2(pt.y - p.pinY, pt.x - p.pinX), j.min, j.max);
    draw();
  }

  function onUp(ev) {
    if (pendingPull && !pendingPull.moved) {
      const j = byId(pendingPull.id);
      if (j) stiffen(j);
    }
    pendingPull = null;
    drag = null;
  }

  function hardwareFacts(posed) {
    const facts = [];
    const stiffHips = joints.filter(j => j.id.endsWith("_hip") && j.stiff);
    const stiffKnees = joints.filter(j => j.id.endsWith("_knee") && j.stiff);
    const neck = byId("neck");
    const head = byId("head");

    if (stiffHips.length) {
      facts.push("Stiff " + stiffHips.map(j => j.name.replace(" hip", "")).join("/") + " hip — hobble.");
    }
    if (stiffKnees.length >= 2) facts.push("Knees locked — drag.");
    else if (stiffKnees.length === 1) facts.push(stiffKnees[0].name + " stiff — limp.");
    if (neck.stiff) facts.push("Neck locked — mailbox poke.");
    if (head.stiff && !neck.stiff) facts.push("Skull latch stiff — aim stays wrong.");
    if (extras.length) facts.push("Extra hinge — folded in a stupid place.");
    const hp = posed[head.id];
    if (hp.tipY > body.y + 20) facts.push("Head aimed at dirt — graze cannot reach.");
    return facts;
  }

  function headNearLeaf(posed) {
    const hp = posed[byId("head").id];
    const dx = hp.tipX - LEAF.x;
    const dy = hp.tipY - LEAF.y;
    return dx * dx + dy * dy < 36 * 36;
  }

  function finishTry(reached, facts) {
    if (reached) {
      setNote("leaf got bitten", facts.join(" ") || "It worked. That does not mean the hinges are right.");
    } else if (!facts.length) {
      setNote("leaf still up there", "Took the steps. Missed the snack.");
    } else {
      setNote("try failed", facts.join(" "));
    }
  }

  function runTry() {
    if (trying) return;
    trying = true;
    btnTry.disabled = true;
    setNote("trying", "Walk, then graze. Hardware is law.");

    const start = {};
    for (const j of allJoints()) start[j.id] = j.angle;

    const t0 = performance.now();
    const DUR = 2800;
    let reached = false;
    const early = hardwareFacts(pose());

    function frame(now) {
      const t = Math.min(1, (now - t0) / DUR);
      const walk = Math.min(1, t / 0.55);
      const graze = Math.max(0, (t - 0.55) / 0.45);

      const stiffHipN = joints.filter(j => j.id.endsWith("_hip") && j.stiff).length;
      const stiffKneeN = joints.filter(j => j.id.endsWith("_knee") && j.stiff).length;
      let speed = 70 - stiffHipN * 14 - stiffKneeN * 8 - extras.length * 10;
      if (speed < 8) speed = 8;

      let tip = 0;
      if (stiffHipN >= 2) tip = Math.sin(walk * Math.PI * 2) * 10;
      if (stiffHipN >= 3) tip += 6;
      worldX = walk * speed;
      body.y = 130 + tip + (stiffKneeN >= 3 ? 8 : 0);

      const gait = walk * Math.PI * 4;
      ["fl_hip", "fr_hip", "bl_hip", "br_hip"].forEach(function (id) {
        const j = byId(id);
        if (j.live && !j.stiff) {
          const phase = id.charAt(0) === "f" ? 0 : Math.PI;
          const side = id.indexOf("l") >= 0 ? 1 : -1;
          j.angle = clamp(start[id] + Math.sin(gait + phase) * 0.28 * side, j.min, j.max);
        }
      });
      ["fl_knee", "fr_knee", "bl_knee", "br_knee"].forEach(function (id) {
        const j = byId(id);
        if (j.live && !j.stiff) {
          j.angle = clamp(start[id] + Math.sin(gait + 0.5) * 0.35, j.min, j.max);
        }
      });
      extras.forEach(function (e) {
        if (e.live && !e.stiff) {
          e.angle = clamp(start[e.id] + Math.sin(gait * 1.3) * 0.9, e.min, e.max);
        }
      });

      const neck = byId("neck");
      const head = byId("head");
      if (graze > 0) {
        if (neck.live && !neck.stiff) {
          const target = -2.05;
          neck.angle = clamp(start.neck + (target - start.neck) * graze, neck.min, neck.max);
        } else if (neck.stiff) {
          neck.angle = start.neck + graze * 0.15;
        }
        if (head.live && !head.stiff) {
          const posed = pose();
          const pin = posed.head;
          const want = Math.atan2(LEAF.y - pin.pinY, LEAF.x - pin.pinX);
          head.angle = clamp(start.head + (want - start.head) * graze, head.min, head.max);
        }
      }

      const posed = pose();
      if (headNearLeaf(posed)) reached = true;
      draw();

      if (t < 1) {
        animId = requestAnimationFrame(frame);
      } else {
        for (const j of allJoints()) {
          if (j.live && !j.stiff) j.angle = start[j.id];
        }
        body.y = 130;
        trying = false;
        btnTry.disabled = false;
        animId = null;
        const late = hardwareFacts(pose());
        const all = [];
        early.concat(late).forEach(function (f) {
          if (all.indexOf(f) < 0) all.push(f);
        });
        finishTry(reached, all);
        draw();
      }
    }
    animId = requestAnimationFrame(frame);
  }

  canvas.addEventListener("pointerdown", onDown);
  canvas.addEventListener("pointermove", onMove);
  canvas.addEventListener("pointerup", onUp);
  canvas.addEventListener("pointercancel", onUp);

  btnPull.onclick = function () { if (!trying) setMode("pull"); };
  btnAdd.onclick = function () { if (!trying) setMode("add"); };
  btnTry.onclick = function () { runTry(); };
  btnReset.onclick = function () { resetAll(); };

  resetAll();
})();
  </script>
</body>
</html>
