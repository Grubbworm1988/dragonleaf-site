<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dragonleaf</title>
  <meta name="description" content="Dragonleaf — small games and tools. Coming soon." />
  <style>
    :root {
      --bg: #14110e;
      --ink: #e7e0d4;
      --mute: #9a8f7e;
      --leaf: #6f8f62;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); }
    body {
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      display: grid;
      place-items: center;
      padding: 2rem;
    }
    main { max-width: 28rem; text-align: left; }
    h1 {
      font-size: 1.75rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      margin: 0 0 0.75rem;
    }
    p { margin: 0 0 1rem; line-height: 1.5; color: var(--mute); }
    a { color: var(--leaf); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .mark { color: var(--leaf); }
  </style>
</head>
<body>
  <main>
    <h1>Dragonleaf</h1>
    <p>Small games and tools. Two-person shop. No live-ops hose.</p>
    <p>This domain is live. The first thing is not ready to ship yet.</p>
    <p>Mail: <a href="mailto:contact@dragonleaf.app">contact@dragonleaf.app</a></p>
    <p class="mark">— house name, not a storefront yet</p>
  </main>
</body>
</html>
