<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wrong Joints</title>
  <style>
    :root {
      --bg: #12100d;
      --card: #1c1914;
      --ink: #e8e0d2;
      --mute: #9a8f7e;
      --leaf: #7a9a6a;
      --warn: #c4a15a;
      --stiff: #b5684a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
    }
    header, .bar, .stage, footer {
      max-width: 28rem;
      margin: 0 auto;
      padding: 0 1.1rem;
    }
    header { padding-top: 1.1rem; }
    h1 { font-size: 1.35rem; margin: 0 0 .3rem; font-weight: 600; }
    .sub { margin: 0; color: var(--mute); font-size: .95rem; line-height: 1.4; }
    .bar { display: flex; gap: .4rem; flex-wrap: wrap; padding-top: .85rem; }
    button {
      font: inherit;
      font-size: .85rem;
      background: var(--card);
      color: var(--ink);
      border: 1px solid #2c261e;
      padding: .4rem .65rem;
      cursor: pointer;
    }
    button.on { border-color: var(--leaf); color: var(--leaf); }
    button:disabled { opacity: .45; cursor: default; }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      margin-top: .75rem;
      background: var(--card);
      border: 1px solid #2c261e;
      touch-action: none;
    }
    .note {
      margin: .75rem 0 0;
      min-height: 4.6rem;
      padding: .8rem .9rem;
      background: var(--card);
      border: 1px solid #2c261e;
    }
    .note b { color: var(--warn); font-weight: 600; }
    .note p { margin: .3rem 0 0; color: var(--mute); line-height: 1.4; }
    footer { padding: 1rem 1.1rem 2rem; color: #6d6558; font-size: .78rem; }
  </style>
</head>
<body>
  <header>
    <h1>Wrong Joints</h1>
    <p class="sub">Pins on the hinges. Pull one and that bend goes stiff. The animal still has to try.</p>
  </header>
  <div class="bar">
    <button id="pull" class="on">pull pin</button>
    <button id="add">add joint</button>
    <button id="replace">replace pin</button>
    <button id="bend">bend</button>
    <button id="try">try</button>
    <button id="reset">reset giraffe</button>
  </div>
  <div class="stage">
    <canvas id="c" width="360" height="280"></canvas>
    <div class="note" id="note"></div>
  </div>
  <footer>Dragonleaf experiment. Wrong Joints. Not a catalog.</footer>
  <script>
/* Wrong Joints — giraffe motor.
   Pull stiffens a socket. Part stays on.
   Add inserts a hinge on a bone. Add does not restore a pulled pin.
   Replace restores a dead socket only.
   Bend poses a live pin.
   Gravity drops the body. Feet plant. Head is not a fifth foot while standing.
   Barrel is the heavy mass. Head is light. Front feet alone cannot hold a handstand.
   Try = walk or crawl if it cannot stand, then a slow reach for the leaf.
   No timer-lerp commute. No animal rewrite in this file.
*/
(function () {
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const noteEl = document.getElementById("note");
  const btnPull = document.getElementById("pull");
  const btnAdd = document.getElementById("add");
  const btnReplace = document.getElementById("replace");
  const btnBend = document.getElementById("bend");
  const btnTry = document.getElementById("try");
  const btnReset = document.getElementById("reset");

  const LEAF = { x: 310, y: 28 };
  const FLOOR = 252;
  const START = { x: 130, y: 148 };

  const DEFS = [
    { id: "neck", name: "neck", site: "neck", parent: "body", rest: -1.35, min: -2.4, max: -0.2, len: 78, ax: 48, ay: -8 },
    { id: "head", name: "skull", site: "skull", parent: "neck", rest: -0.15, min: -1.1, max: 0.9, len: 34 },
    { id: "fl_hip", name: "front left hip", site: "shoulder", parent: "body", rest: 1.38, min: 0.6, max: 2.3, len: 42, ax: 36, ay: 10 },
    { id: "fl_knee", name: "front left knee", site: "knee", parent: "fl_hip", rest: 1.68, min: 0.9, max: 2.35, len: 48 },
    { id: "fr_hip", name: "front right hip", site: "shoulder", parent: "body", rest: 1.42, min: 0.6, max: 2.3, len: 42, ax: 28, ay: 12 },
    { id: "fr_knee", name: "front right knee", site: "knee", parent: "fr_hip", rest: 1.72, min: 0.9, max: 2.35, len: 48 },
    { id: "bl_hip", name: "back left hip", site: "hip", parent: "body", rest: 1.74, min: 0.8, max: 2.5, len: 42, ax: -28, ay: 10 },
    { id: "bl_knee", name: "back left knee", site: "knee", parent: "bl_hip", rest: 1.48, min: 0.8, max: 2.2, len: 48 },
    { id: "br_hip", name: "back right hip", site: "hip", parent: "body", rest: 1.78, min: 0.8, max: 2.5, len: 42, ax: -36, ay: 12 },
    { id: "br_knee", name: "back right knee", site: "knee", parent: "br_hip", rest: 1.52, min: 0.8, max: 2.2, len: 48 }
  ];

  let mode = "pull";
  let trying = false;
  let phase = "";
  let animId = null;
  let drag = null;
  let worldX = 0;
  let joints = [];
  let extras = [];
  let body = { x: START.x, y: START.y, tilt: 0 };
  let pendingTap = null;
  let belly = false;
  let gaitT = 0;
  let reached = false;
  let stall = 0;
  let lastPlantX = 0;

  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function approach(v, t, s) {
    const d = t - v;
    if (Math.abs(d) <= s) return t;
    return v + Math.sign(d) * s;
  }
  function allJoints() { return joints.concat(extras); }
  function byId(id) { return allJoints().find(j => j.id === id); }
  function isLive(j) { return j && j.present && j.live && !j.stiff; }

  function setNote(title, line) {
    noteEl.innerHTML = "<b>" + title + "</b><p>" + line + "</p>";
  }

  function setMode(m) {
    mode = m;
    btnPull.classList.toggle("on", m === "pull");
    btnAdd.classList.toggle("on", m === "add");
    btnReplace.classList.toggle("on", m === "replace");
    btnBend.classList.toggle("on", m === "bend");
    btnTry.disabled = trying;
  }

  function childrenOf(id) {
    return allJoints().filter(j => j.parent === id && j.present);
  }

  function chainEnd(j) {
    let cur = j;
    for (let n = 0; n < 12; n++) {
      const kids = childrenOf(cur.id);
      if (!kids.length) return cur;
      cur = kids[0];
    }
    return cur;
  }

  function legRoots() {
    return joints.filter(j => j.parent === "body" && (j.site === "hip" || j.site === "shoulder") && j.present);
  }

  function feet() {
    return legRoots().map(chainEnd);
  }

  function sideOf(j) {
    let cur = j;
    for (let n = 0; n < 12; n++) {
      if (cur.parent === "body") {
        if (cur.site === "shoulder") return "front";
        if (cur.site === "hip") return "rear";
        return "other";
      }
      cur = byId(cur.parent);
      if (!cur) return "other";
    }
    return "other";
  }

  function resetAll() {
    joints = DEFS.map(d => Object.assign({}, d, {
      angle: d.rest, stiff: false, live: true, present: true
    }));
    extras = [];
    body = { x: START.x, y: START.y, tilt: 0 };
    worldX = 0;
    drag = null;
    pendingTap = null;
    belly = false;
    gaitT = 0;
    reached = false;
    stall = 0;
    trying = false;
    phase = "";
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    settleGravity();
    setMode("pull");
    setNote("stock giraffe", "Pull a pin to lock a bend. Add puts a hinge on a bone. Replace puts a pulled pin back. Bend poses a live joint. Try walks or crawls, then reaches.");
    draw();
  }

  function pose() {
    const map = {};
    const ox0 = body.x + worldX;
    const oy0 = body.y;
    const c = Math.cos(body.tilt || 0);
    const s = Math.sin(body.tilt || 0);

    function place(j) {
      if (map[j.id]) return map[j.id];
      let ox, oy;
      if (j.parent === "body") {
        const ax = j.ax || 0, ay = j.ay || 0;
        ox = ox0 + ax * c - ay * s;
        oy = oy0 + ax * s + ay * c;
      } else {
        const p = place(byId(j.parent));
        ox = p.tipX; oy = p.tipY;
      }
      map[j.id] = {
        pinX: ox,
        pinY: oy,
        tipX: ox + Math.cos(j.angle + (j.parent === "body" ? (body.tilt || 0) : 0)) * j.len,
        tipY: oy + Math.sin(j.angle + (j.parent === "body" ? (body.tilt || 0) : 0)) * j.len
      };
      return map[j.id];
    }
    for (const j of allJoints()) place(j);
    return map;
  }

  function contacts(posed) {
    const list = [];
    for (const f of feet()) {
      const p = posed[f.id];
      if (!p) continue;
      list.push({
        j: f,
        p: p,
        side: sideOf(f),
        planted: p.tipY >= FLOOR - 8
      });
    }
    return list;
  }

  function massCenter(posed) {
    const bx = body.x + worldX;
    const by = body.y;
    let mx = bx * 10;
    let my = by * 10;
    let m = 10;
    const neck = posed.neck;
    if (neck) {
      mx += ((neck.pinX + neck.tipX) * 0.5) * 2;
      my += ((neck.pinY + neck.tipY) * 0.5) * 2;
      m += 2;
    }
    const head = posed.head;
    if (head) {
      mx += head.tipX * 1.2;
      my += head.tipY * 1.2;
      m += 1.2;
    }
    return { x: mx / m, y: my / m };
  }

  function settleGravity() {
    const bellyY = FLOOR - 18;
    const posed0 = pose();
    const foots = contacts(posed0);
    let lowest = -Infinity;
    foots.forEach(item => { if (item.p.tipY > lowest) lowest = item.p.tipY; });
    if (lowest === -Infinity) lowest = body.y + 18;
    const drop = FLOOR - 3 - lowest;

    const wouldPlant = foots.filter(item => item.p.tipY + drop >= FLOOR - 8);
    const front = wouldPlant.filter(item => item.side === "front");
    const rear = wouldPlant.filter(item => item.side === "rear");
    const com = massCenter(posed0);
    let minX = Infinity, maxX = -Infinity;
    wouldPlant.forEach(item => {
      if (item.p.tipX < minX) minX = item.p.tipX;
      if (item.p.tipX > maxX) maxX = item.p.tipX;
    });
    const bothEnds = front.length > 0 && rear.length > 0;
    const overSupport = bothEnds && com.x >= minX - 2 && com.x <= maxX + 2;

    if (overSupport) {
      belly = false;
      body.tilt = approach(body.tilt, 0, 0.08);
      body.y += drop;
      if (body.y > bellyY) body.y = bellyY;
    } else {
      belly = true;
      body.tilt = approach(body.tilt, 0, 0.22);
      body.y = approach(body.y, bellyY, 10);
    }

    const posed = pose();
    const after = contacts(posed);
    const plantedNow = after.filter(item => item.p.tipY >= FLOOR - 8);
    const head = byId("head");
    const hp = posed[head.id];
    const headDrag = belly && hp && hp.tipY >= FLOOR - 10;

    return {
      planted: plantedNow.length,
      front: plantedNow.filter(item => item.side === "front").length,
      rear: plantedNow.filter(item => item.side === "rear").length,
      belly: belly,
      stand: !belly && overSupport,
      headDrag: headDrag
    };
  }

  function hitPin(x, y, posed) {
    let best = null, bestD = 16 * 16;
    for (const j of allJoints()) {
      if (!j.present) continue;
      const p = posed[j.id];
      const d = (x - p.pinX) * (x - p.pinX) + (y - p.pinY) * (y - p.pinY);
      if (d <= bestD) { bestD = d; best = j; }
    }
    return best;
  }

  function distSeg(px, py, x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1;
    const l2 = dx * dx + dy * dy || 1;
    let t = ((px - x1) * dx + (py - y1) * dy) / l2;
    t = Math.max(0, Math.min(1, t));
    return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
  }

  function hitShaft(x, y, posed) {
    let best = null, bestD = 14;
    for (const j of allJoints()) {
      if (!j.present) continue;
      const p = posed[j.id];
      const d = distSeg(x, y, p.pinX, p.pinY, p.tipX, p.tipY);
      if (d < bestD) { bestD = d; best = j; }
    }
    return best;
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
    ctx.fill();
  }

  function drawSeg(posed, j, color, width) {
    const p = posed[j.id];
    if (!p) return;
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(p.pinX, p.pinY);
    ctx.lineTo(p.tipX, p.tipY);
    ctx.stroke();
  }

  function draw() {
    const posed = pose();
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#2a241c";
    ctx.fillRect(0, FLOOR, canvas.width, canvas.height - FLOOR);

    ctx.fillStyle = "#3a5034";
    ctx.fillRect(LEAF.x - 2, LEAF.y + 8, 4, FLOOR - (LEAF.y + 8));
    ctx.fillStyle = "#7a9a6a";
    ctx.beginPath();
    ctx.ellipse(LEAF.x, LEAF.y, 14, 10, -0.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#9ab888";
    ctx.beginPath();
    ctx.ellipse(LEAF.x + 8, LEAF.y + 4, 9, 6, 0.5, 0, Math.PI * 2);
    ctx.fill();

    const bx = body.x + worldX, by = body.y;

    drawSeg(posed, byId("br_hip"), "#a89870", 10);
    drawSeg(posed, byId("br_knee"), "#a89870", 9);
    drawSeg(posed, byId("bl_hip"), "#c4b89a", 10);
    drawSeg(posed, byId("bl_knee"), "#c4b89a", 9);

    ctx.save();
    ctx.translate(bx, by);
    ctx.rotate(body.tilt || 0);
    ctx.fillStyle = "#b89a62";
    roundRect(-52, -18, 108, 36, 8);
    ctx.restore();

    drawSeg(posed, byId("fr_hip"), "#a89870", 10);
    drawSeg(posed, byId("fr_knee"), "#a89870", 9);
    drawSeg(posed, byId("fl_hip"), "#c4b89a", 10);
    drawSeg(posed, byId("fl_knee"), "#c4b89a", 9);

    drawSeg(posed, byId("neck"), "#c4b07a", 12);
    const head = byId("head");
    const hp = posed[head.id];
    ctx.fillStyle = "#e2d2a4";
    ctx.beginPath();
    ctx.ellipse(hp.tipX, hp.tipY, 18, 11, head.angle + (body.tilt || 0), 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#c4b89a";
    ctx.beginPath();
    ctx.ellipse(
      hp.tipX + Math.cos(head.angle) * 16,
      hp.tipY + Math.sin(head.angle) * 16,
      10, 5, head.angle, 0, Math.PI * 2
    );
    ctx.fill();

    for (const e of extras) {
      if (e.present) drawSeg(posed, e, "#8a7a5c", 7);
    }

    for (const j of allJoints()) {
      if (!j.present) continue;
      const p = posed[j.id];
      ctx.beginPath();
      ctx.arc(p.pinX, p.pinY, 7, 0, Math.PI * 2);
      ctx.fillStyle = (j.stiff || !j.live) ? "#b5684a" : "#7a9a6a";
      ctx.fill();
      if (j.site === "extra") {
        ctx.strokeStyle = "#c4a15a";
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
    }
  }

  function local(ev) {
    const r = canvas.getBoundingClientRect();
    const t = ev.changedTouches ? ev.changedTouches[0] : ev;
    return {
      x: (t.clientX - r.left) * (canvas.width / r.width),
      y: (t.clientY - r.top) * (canvas.height / r.height)
    };
  }

  function stiffen(j) {
    j.stiff = true;
    j.live = false;
    settleGravity();
    setNote(j.name + " locked", "Bend is stiff. Part stays on.");
    draw();
  }

  function restore(j) {
    j.stiff = false;
    j.live = true;
    settleGravity();
    setNote(j.name + " live", "Pin is back. Bend if you want to pose it.");
    draw();
  }

  function addExtraOn(parent) {
    const id = "extra_" + extras.length + "_" + Date.now().toString(36);
    const half = parent.len * 0.5;
    const oldLen = parent.len;
    parent.len = half;
    const child = {
      id: id,
      name: "extra hinge on " + parent.name,
      site: "extra",
      parent: parent.id,
      rest: 0.4,
      min: -1.2,
      max: 1.4,
      len: oldLen - half,
      angle: 0.4,
      stiff: false,
      live: true,
      present: true
    };
    for (const o of allJoints()) {
      if (o.id !== id && o.parent === parent.id) o.parent = id;
    }
    extras.push(child);
    settleGravity();
    setNote("extra hinge", "Nature did not order this. Try will fold it in a stupid place.");
    draw();
  }

  function onDown(ev) {
    if (trying) return;
    ev.preventDefault();
    canvas.setPointerCapture(ev.pointerId);
    const pt = local(ev);
    const posed = pose();
    const pin = hitPin(pt.x, pt.y, posed);

    if (mode === "pull") {
      if (pin) pendingTap = { id: pin.id, x: pt.x, y: pt.y, moved: false };
      return;
    }

    if (mode === "add") {
      if (pin) {
        setNote("that's a pin", "Add taps a bone, not a socket. Replace puts a pulled pin back.");
        return;
      }
      const shaft = hitShaft(pt.x, pt.y, posed);
      if (shaft) addExtraOn(shaft);
      else setNote("missed", "Tap a bone shaft to add a hinge.");
      return;
    }

    if (mode === "replace") {
      if (pin && (pin.stiff || !pin.live)) restore(pin);
      else if (pin) setNote("already in", "That socket still has its pin.");
      else setNote("missed", "Replace taps a dead socket only.");
      return;
    }

    if (mode === "bend") {
      if (pin && isLive(pin)) drag = { id: pin.id };
      else if (pin) setNote("stiff", "Dead socket. Replace it first if you want that bend back.");
      return;
    }
  }

  function onMove(ev) {
    if (trying) return;
    const pt = local(ev);
    if (pendingTap) {
      const dx = pt.x - pendingTap.x, dy = pt.y - pendingTap.y;
      if (dx * dx + dy * dy > 25) pendingTap.moved = true;
    }
    if (!drag) return;
    ev.preventDefault();
    const j = byId(drag.id);
    if (!isLive(j)) return;
    const posed = pose();
    const p = posed[j.id];
    j.angle = clamp(Math.atan2(pt.y - p.pinY, pt.x - p.pinX) - (j.parent === "body" ? (body.tilt || 0) : 0), j.min, j.max);
    settleGravity();
    draw();
  }

  function onUp() {
    if (pendingTap && !pendingTap.moved && mode === "pull") {
      const j = byId(pendingTap.id);
      if (j) stiffen(j);
    }
    pendingTap = null;
    drag = null;
  }

  function hardwareFacts(g) {
    const facts = [];
    const stiffHips = joints.filter(j => j.id.endsWith("_hip") && j.stiff);
    const stiffKnees = joints.filter(j => j.id.endsWith("_knee") && j.stiff);
    const neck = byId("neck");
    const head = byId("head");
    if (g.belly) facts.push("Could not stand — belly on the dirt.");
    else if (g.front && !g.rear) facts.push("Only the front planted — it tipped.");
    else if (g.rear && !g.front) facts.push("Only the rear planted — it tipped.");
    if (stiffHips.length) facts.push("Stiff " + stiffHips.map(j => j.name.replace(" hip", "")).join("/") + " hip — thigh locked, knee still its own pin.");
    if (stiffKnees.length >= 2) facts.push("Knees locked — poles.");
    else if (stiffKnees.length === 1) facts.push(stiffKnees[0].name + " stiff — limp.");
    if (neck.stiff) facts.push("Neck locked — mailbox poke.");
    if (head.stiff && !neck.stiff) facts.push("Skull latch stiff — aim stays wrong.");
    if (extras.length) facts.push("Extra hinge — folded in a stupid place.");
    return facts;
  }

  function headNearLeaf(posed) {
    const hp = posed[byId("head").id];
    const dx = hp.tipX - LEAF.x;
    const dy = hp.tipY - LEAF.y;
    return dx * dx + dy * dy < 28 * 28;
  }

  function finishTry(g) {
    const facts = hardwareFacts(g);
    if (reached) {
      setNote("leaf got bitten", facts.join(" ") || "It worked. That does not mean the hinges are right.");
    } else if (g.belly && !g.planted) {
      setNote("stuck on the dirt", facts.join(" ") || "Nothing planted. No commute.");
    } else {
      setNote("leaf still up there", facts.join(" ") || "Took what the hardware allowed. Missed the snack.");
    }
  }

  function huntFloor() {
    const posed = pose();
    const down = Math.PI / 2;
    for (const f of feet()) {
      if (!isLive(f)) continue;
      const p = posed[f.id];
      if (p.tipY < FLOOR - 6) {
        f.angle = clamp(approach(f.angle, down, 0.08), f.min, f.max);
      }
    }
    extras.forEach(e => {
      if (isLive(e)) e.angle = clamp(e.angle + Math.sin(gaitT * 3) * 0.05, e.min, e.max);
    });
  }

  function stepGait() {
    gaitT += 0.14;
    const gait = gaitT;
    function pair(id) {
      return (id.indexOf("fl_") === 0 || id.indexOf("br_") === 0) ? 0 : Math.PI;
    }
    ["fl_hip", "fr_hip", "bl_hip", "br_hip"].forEach(function (id) {
      const j = byId(id);
      if (!isLive(j)) return;
      j.angle = clamp(j.rest + Math.sin(gait + pair(id)) * 0.32, j.min, j.max);
    });
    ["fl_knee", "fr_knee", "bl_knee", "br_knee"].forEach(function (id) {
      const j = byId(id);
      if (!isLive(j)) return;
      j.angle = clamp(j.rest + Math.sin(gait + pair(id) + 0.4) * 0.4, j.min, j.max);
    });
    extras.forEach(function (e) {
      if (isLive(e)) e.angle = clamp(e.rest + Math.sin(gait * 1.3) * 0.9, e.min, e.max);
    });
  }

  function reachLeaf() {
    const neck = byId("neck");
    const head = byId("head");
    const posed = pose();
    if (isLive(neck)) {
      const pin = posed[neck.id];
      const want = Math.atan2(LEAF.y - pin.pinY, LEAF.x - pin.pinX) - (body.tilt || 0);
      neck.angle = clamp(approach(neck.angle, want, 0.035), neck.min, neck.max);
    }
    if (isLive(head)) {
      const pin = posed[head.id];
      const want = Math.atan2(LEAF.y - pin.pinY, LEAF.x - pin.pinX);
      head.angle = clamp(approach(head.angle, want, 0.04), head.min, head.max);
    }
  }

  function runTry() {
    if (trying) return;
    trying = true;
    reached = false;
    gaitT = 0;
    stall = 0;
    lastPlantX = worldX;
    btnTry.disabled = true;
    settleGravity();
    phase = belly ? "crawl" : "walk";
    setNote("trying", belly ? "Cannot stand. Hunt the floor, then reach." : "Walk with what can plant. Then reach.");

    function frame() {
      let g;
      if (phase === "walk") {
        stepGait();
        g = settleGravity();
        if (g.belly || !g.stand) {
          phase = "crawl";
          stall = 0;
          setNote("trying", "Cannot stand. Barrel on the dirt. Hunt the floor, then reach.");
        } else if (g.stand) {
          worldX += 1.15 + Math.min(g.planted, 4) * 0.1;
          lastPlantX = worldX;
          stall = 0;
        } else {
          stall += 1;
        }
        if (body.x + worldX > 230 || stall > 50) phase = "eat";
      } else if (phase === "crawl") {
        huntFloor();
        g = settleGravity();
        const movers = g.planted + (g.headDrag ? 1 : 0);
        if (movers > 0) {
          worldX += 0.55;
          lastPlantX = worldX;
          stall = 0;
        } else {
          stall += 1;
        }
        if (stall > 70 || body.x + worldX > 250) phase = "eat";
      } else {
        reachLeaf();
        g = settleGravity();
        if (headNearLeaf(pose())) {
          reached = true;
          phase = "done";
        } else {
          stall += 1;
          if (stall > 90) phase = "done";
        }
      }

      if (worldX === lastPlantX && (phase === "walk" || phase === "crawl")) {
        /* stall already counted when nothing planted */
      }

      draw();

      if (phase === "done") {
        trying = false;
        btnTry.disabled = false;
        animId = null;
        finishTry(g || settleGravity());
        draw();
        return;
      }
      animId = requestAnimationFrame(frame);
    }
    animId = requestAnimationFrame(frame);
  }

  canvas.addEventListener("pointerdown", onDown);
  canvas.addEventListener("pointermove", onMove);
  canvas.addEventListener("pointerup", onUp);
  canvas.addEventListener("pointercancel", onUp);

  btnPull.onclick = function () { if (!trying) setMode("pull"); };
  btnAdd.onclick = function () { if (!trying) setMode("add"); };
  btnReplace.onclick = function () { if (!trying) setMode("replace"); };
  btnBend.onclick = function () { if (!trying) setMode("bend"); };
  btnTry.onclick = function () { runTry(); };
  btnReset.onclick = function () { resetAll(); };

  resetAll();
})();
  </script>
</body>
</html>
