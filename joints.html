<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wrong Joints</title>
  <style>
    :root {
      --bg: #12100d;
      --card: #1c1914;
      --ink: #e8e0d2;
      --mute: #9a8f7e;
      --leaf: #7a9a6a;
      --warn: #c4a15a;
      --stiff: #b5684a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
    }
    header, .bar, .animals, .stage, footer {
      max-width: 28rem;
      margin: 0 auto;
      padding: 0 1.1rem;
    }
    header { padding-top: 1.1rem; }
    h1 { font-size: 1.35rem; margin: 0 0 .3rem; font-weight: 600; }
    .sub { margin: 0; color: var(--mute); font-size: .95rem; line-height: 1.4; }
    .bar, .animals { display: flex; gap: .4rem; flex-wrap: wrap; padding-top: .85rem; }
    .animals { padding-top: .55rem; }
    button {
      font: inherit;
      font-size: .85rem;
      background: var(--card);
      color: var(--ink);
      border: 1px solid #2c261e;
      padding: .4rem .65rem;
      cursor: pointer;
    }
    button.on { border-color: var(--leaf); color: var(--leaf); }
    button:disabled { opacity: .45; cursor: default; }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      margin-top: .75rem;
      background: var(--card);
      border: 1px solid #2c261e;
      touch-action: none;
    }
    .note {
      margin: .75rem 0 0;
      min-height: 4.6rem;
      padding: .8rem .9rem;
      background: var(--card);
      border: 1px solid #2c261e;
    }
    .note b { color: var(--warn); font-weight: 600; }
    .note p { margin: .3rem 0 0; color: var(--mute); line-height: 1.4; }
    footer { padding: 1rem 1.1rem 2rem; color: #6d6558; font-size: .78rem; }
  </style>
</head>
<body>
  <header>
    <h1>Wrong Joints</h1>
    <p class="sub">Pins on the hinges. Pull one and that bend goes stiff. The animal still has to try.</p>
  </header>
  <div class="animals" id="animals"></div>
  <div class="bar">
    <button id="pull" class="on">pull pin</button>
    <button id="add">add joint</button>
    <button id="try">try</button>
    <button id="reset">reset giraffe</button>
  </div>
  <div class="stage">
    <canvas id="c" width="360" height="280"></canvas>
    <div class="note" id="note"></div>
  </div>
  <footer>Dragonleaf experiment. Wrong Joints. Not a catalog.</footer>
  <script>
(function () {
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const noteEl = document.getElementById("note");
  const animalsEl = document.getElementById("animals");
  const btnPull = document.getElementById("pull");
  const btnAdd = document.getElementById("add");
  const btnTry = document.getElementById("try");
  const btnReset = document.getElementById("reset");

  const LEAF = { x: 310, y: 28 };

  const ANIMALS = {
    giraffe: {
      id: "giraffe",
      label: "giraffe",
      bodyColor: "#b89a62",
      body: { w: 108, h: 36, y: 130 },
      intro: "Stock giraffe. Pull a pin to lock a bend. Try walks, then grazes the high leaf.",
      tryVerb: "Walk, then graze. Hardware is law.",
      defs: [
        { id: "neck", name: "neck", site: "neck", parent: "body", rest: -1.35, min: -2.4, max: -0.2, len: 78, ax: 48, ay: -8 },
        { id: "head", name: "skull", site: "skull", parent: "neck", rest: -0.15, min: -1.1, max: 0.9, len: 34 },
        { id: "fl_hip", name: "front left hip", site: "shoulder", parent: "body", rest: 1.45, min: 0.4, max: 2.5, len: 42, ax: 36, ay: 10 },
        { id: "fl_knee", name: "front left knee", site: "knee", parent: "fl_hip", rest: 0.35, min: -0.2, max: 1.6, len: 48 },
        { id: "fr_hip", name: "front right hip", site: "shoulder", parent: "body", rest: 1.55, min: 0.4, max: 2.5, len: 42, ax: 28, ay: 12 },
        { id: "fr_knee", name: "front right knee", site: "knee", parent: "fr_hip", rest: 0.4, min: -0.2, max: 1.6, len: 48 },
        { id: "bl_hip", name: "back left hip", site: "hip", parent: "body", rest: 1.7, min: 0.6, max: 2.7, len: 42, ax: -28, ay: 10 },
        { id: "bl_knee", name: "back left knee", site: "knee", parent: "bl_hip", rest: 0.25, min: -0.3, max: 1.5, len: 48 },
        { id: "br_hip", name: "back right hip", site: "hip", parent: "body", rest: 1.8, min: 0.6, max: 2.7, len: 42, ax: -36, ay: 12 },
        { id: "br_knee", name: "back right knee", site: "knee", parent: "br_hip", rest: 0.3, min: -0.3, max: 1.5, len: 48 }
      ]
    },
    heron: {
      id: "heron",
      label: "z-neck heron",
      bodyColor: "#8a948c",
      body: { w: 72, h: 28, y: 150 },
      intro: "Z-neck heron. Cervical stack is already two hinges. Rest is a coiled S. Try snaps at the leaf.",
      tryVerb: "Snap toward the leaf. Hardware is law.",
      defs: [
        { id: "neck", name: "neck base", site: "neck", parent: "body", rest: -0.55, min: -2.2, max: 0.4, len: 36, ax: 34, ay: -6 },
        { id: "neck_mid", name: "mid neck", site: "neck", parent: "neck", rest: -2.35, min: -3.0, max: -0.4, len: 40 },
        { id: "head", name: "skull", site: "skull", parent: "neck_mid", rest: 0.55, min: -0.8, max: 1.4, len: 28 },
        { id: "fl_hip", name: "front left hip", site: "shoulder", parent: "body", rest: 1.55, min: 0.5, max: 2.6, len: 52, ax: 22, ay: 10 },
        { id: "fl_knee", name: "front left knee", site: "knee", parent: "fl_hip", rest: 0.55, min: -0.1, max: 1.8, len: 56 },
        { id: "fr_hip", name: "front right hip", site: "shoulder", parent: "body", rest: 1.65, min: 0.5, max: 2.6, len: 52, ax: 14, ay: 12 },
        { id: "fr_knee", name: "front right knee", site: "knee", parent: "fr_hip", rest: 0.6, min: -0.1, max: 1.8, len: 56 },
        { id: "bl_hip", name: "back left hip", site: "hip", parent: "body", rest: 1.75, min: 0.6, max: 2.7, len: 52, ax: -18, ay: 10 },
        { id: "bl_knee", name: "back left knee", site: "knee", parent: "bl_hip", rest: 0.5, min: -0.2, max: 1.7, len: 56 },
        { id: "br_hip", name: "back right hip", site: "hip", parent: "body", rest: 1.85, min: 0.6, max: 2.7, len: 52, ax: -26, ay: 12 },
        { id: "br_knee", name: "back right knee", site: "knee", parent: "br_hip", rest: 0.55, min: -0.2, max: 1.7, len: 56 }
      ]
    },
    goat: {
      id: "goat",
      label: "shelf-knee goat",
      bodyColor: "#a89068",
      body: { w: 86, h: 40, y: 128 },
      intro: "Shelf-knee goat. Knees rest chair-folded the wrong way. Try walks the stairs; the high leaf needs unlocked knees.",
      tryVerb: "Walk the shelves, then reach. Hardware is law.",
      defs: [
        { id: "neck", name: "neck", site: "neck", parent: "body", rest: -0.85, min: -2.0, max: 0.2, len: 34, ax: 40, ay: -10 },
        { id: "head", name: "skull", site: "skull", parent: "neck", rest: -0.2, min: -1.0, max: 0.9, len: 26 },
        { id: "fl_hip", name: "front left hip", site: "shoulder", parent: "body", rest: 1.15, min: 0.2, max: 2.3, len: 30, ax: 30, ay: 14 },
        { id: "fl_knee", name: "front left knee", site: "knee", parent: "fl_hip", rest: -0.95, min: -1.7, max: 1.2, len: 34 },
        { id: "fr_hip", name: "front right hip", site: "shoulder", parent: "body", rest: 1.25, min: 0.2, max: 2.3, len: 30, ax: 22, ay: 16 },
        { id: "fr_knee", name: "front right knee", site: "knee", parent: "fr_hip", rest: -0.9, min: -1.7, max: 1.2, len: 34 },
        { id: "bl_hip", name: "back left hip", site: "hip", parent: "body", rest: 1.35, min: 0.3, max: 2.4, len: 30, ax: -22, ay: 14 },
        { id: "bl_knee", name: "back left knee", site: "knee", parent: "bl_hip", rest: -1.05, min: -1.8, max: 1.1, len: 34 },
        { id: "br_hip", name: "back right hip", site: "hip", parent: "body", rest: 1.45, min: 0.3, max: 2.4, len: 30, ax: -30, ay: 16 },
        { id: "br_knee", name: "back right knee", site: "knee", parent: "br_hip", rest: -1.0, min: -1.8, max: 1.1, len: 34 }
      ]
    }
  };

  let animalId = "giraffe";
  let mode = "pull";
  let trying = false;
  let animId = null;
  let drag = null;
  let worldX = 0;
  let joints = [];
  let extras = [];
  let body = { x: 130, y: 130 };
  let pendingPull = null;

  function animal() { return ANIMALS[animalId]; }

  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  function allJoints() { return joints.concat(extras); }

  function byId(id) { return allJoints().find(j => j.id === id); }

  function setNote(title, line) {
    noteEl.innerHTML = "<b>" + title + "</b><p>" + line + "</p>";
  }

  function setMode(m) {
    mode = m;
    btnPull.classList.toggle("on", m === "pull");
    btnAdd.classList.toggle("on", m === "add");
    btnTry.disabled = trying;
  }

  function syncAnimalButtons() {
    [...animalsEl.querySelectorAll("button")].forEach(function (b) {
      b.classList.toggle("on", b.dataset.id === animalId);
    });
    btnReset.textContent = "reset " + animal().label;
  }

  function resetAll() {
    const a = animal();
    joints = a.defs.map(function (d) {
      return Object.assign({}, d, {
        angle: d.rest,
        stiff: false,
        live: true,
        present: true
      });
    });
    extras = [];
    body = { x: 130, y: a.body.y };
    worldX = 0;
    drag = null;
    pendingPull = null;
    trying = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    setMode("pull");
    syncAnimalButtons();
    setNote(a.label, a.intro);
    draw();
  }

  function selectAnimal(id) {
    if (trying || !ANIMALS[id]) return;
    animalId = id;
    resetAll();
  }

  function pose() {
    const map = {};
    const originBody = { x: body.x + worldX, y: body.y };

    function place(j) {
      if (map[j.id]) return map[j.id];
      var ox, oy;
      if (j.parent === "body") {
        ox = originBody.x + (j.ax || 0);
        oy = originBody.y + (j.ay || 0);
      } else {
        var p = place(byId(j.parent));
        ox = p.tipX; oy = p.tipY;
      }
      var tipX = ox + Math.cos(j.angle) * j.len;
      var tipY = oy + Math.sin(j.angle) * j.len;
      map[j.id] = { pinX: ox, pinY: oy, tipX: tipX, tipY: tipY };
      return map[j.id];
    }
    allJoints().forEach(place);
    return map;
  }

  function hitPin(x, y, posed) {
    var best = null, bestD = 16 * 16;
    allJoints().forEach(function (j) {
      if (!j.present) return;
      var p = posed[j.id];
      var d = (x - p.pinX) * (x - p.pinX) + (y - p.pinY) * (y - p.pinY);
      if (d <= bestD) { bestD = d; best = j; }
    });
    return best;
  }

  function distSeg(px, py, x1, y1, x2, y2) {
    var dx = x2 - x1, dy = y2 - y1;
    var l2 = dx * dx + dy * dy || 1;
    var t = ((px - x1) * dx + (py - y1) * dy) / l2;
    t = Math.max(0, Math.min(1, t));
    return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
  }

  function hitShaft(x, y, posed) {
    var best = null, bestD = 16;
    allJoints().forEach(function (j) {
      if (!j.present) return;
      var p = posed[j.id];
      var d = distSeg(x, y, p.pinX, p.pinY, p.tipX, p.tipY);
      if (d < bestD) { bestD = d; best = j; }
    });
    return best;
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
    ctx.fill();
  }

  function drawSeg(posed, j, color, width) {
    if (!j) return;
    var p = posed[j.id];
    if (!p) return;
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(p.pinX, p.pinY);
    ctx.lineTo(p.tipX, p.tipY);
    ctx.stroke();
  }

  function drawBody(bx, by) {
    var a = animal();
    var w = a.body.w, h = a.body.h;
    ctx.fillStyle = a.bodyColor;
    if (animalId === "heron") {
      roundRect(bx - w / 2, by - h / 2, w, h, 10);
    } else if (animalId === "goat") {
      roundRect(bx - w / 2, by - h / 2, w, h, 6);
      ctx.fillStyle = "#c4b07a";
      ctx.beginPath();
      ctx.ellipse(bx - w / 2 + 8, by - 4, 8, 12, -0.3, 0, Math.PI * 2);
      ctx.fill();
    } else {
      roundRect(bx - w / 2, by - h / 2, w, h, 8);
    }
  }

  function drawHead(posed) {
    var head = byId("head");
    if (!head) return;
    var hp = posed[head.id];
    ctx.fillStyle = animalId === "heron" ? "#d2d8d0" : "#e2d2a4";
    ctx.beginPath();
    if (animalId === "heron") {
      ctx.ellipse(hp.tipX, hp.tipY, 12, 8, head.angle, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#c4a15a";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(hp.tipX, hp.tipY);
      ctx.lineTo(hp.tipX + Math.cos(head.angle) * 26, hp.tipY + Math.sin(head.angle) * 26);
      ctx.stroke();
    } else if (animalId === "goat") {
      ctx.ellipse(hp.tipX, hp.tipY, 14, 11, head.angle, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#8a7a5c";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(hp.tipX - Math.cos(head.angle + 1.2) * 4, hp.tipY - Math.sin(head.angle + 1.2) * 4);
      ctx.lineTo(hp.tipX - Math.cos(head.angle + 1.2) * 18, hp.tipY - Math.sin(head.angle + 1.2) * 18);
      ctx.moveTo(hp.tipX - Math.cos(head.angle - 1.2) * 4, hp.tipY - Math.sin(head.angle - 1.2) * 4);
      ctx.lineTo(hp.tipX - Math.cos(head.angle - 1.2) * 18, hp.tipY - Math.sin(head.angle - 1.2) * 18);
      ctx.stroke();
    } else {
      ctx.ellipse(hp.tipX, hp.tipY, 18, 11, head.angle, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#c4b89a";
      ctx.beginPath();
      ctx.ellipse(
        hp.tipX + Math.cos(head.angle) * 16,
        hp.tipY + Math.sin(head.angle) * 16,
        10, 5, head.angle, 0, Math.PI * 2
      );
      ctx.fill();
    }
  }

  function draw() {
    var posed = pose();
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#2a241c";
    ctx.fillRect(0, 252, canvas.width, 28);

    ctx.fillStyle = "#3a5034";
    ctx.fillRect(LEAF.x - 2, LEAF.y + 8, 4, 244);
    ctx.fillStyle = "#7a9a6a";
    ctx.beginPath();
    ctx.ellipse(LEAF.x, LEAF.y, 14, 10, -0.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#9ab888";
    ctx.beginPath();
    ctx.ellipse(LEAF.x + 8, LEAF.y + 4, 9, 6, 0.5, 0, Math.PI * 2);
    ctx.fill();

    var bx = body.x + worldX, by = body.y;
    var legW = animalId === "heron" ? 7 : (animalId === "goat" ? 9 : 10);
    var kneeW = legW - 1;

    drawSeg(posed, byId("br_hip"), "#a89870", legW);
    drawSeg(posed, byId("br_knee"), "#a89870", kneeW);
    drawSeg(posed, byId("bl_hip"), "#c4b89a", legW);
    drawSeg(posed, byId("bl_knee"), "#c4b89a", kneeW);

    drawBody(bx, by);

    drawSeg(posed, byId("fr_hip"), "#a89870", legW);
    drawSeg(posed, byId("fr_knee"), "#a89870", kneeW);
    drawSeg(posed, byId("fl_hip"), "#c4b89a", legW);
    drawSeg(posed, byId("fl_knee"), "#c4b89a", kneeW);

    drawSeg(posed, byId("neck"), animalId === "heron" ? "#b8c4bc" : "#c4b07a", animalId === "heron" ? 8 : 12);
    if (byId("neck_mid")) drawSeg(posed, byId("neck_mid"), "#c4d0c8", 7);
    drawHead(posed);

    extras.forEach(function (e) {
      if (e.present) drawSeg(posed, e, "#8a7a5c", 7);
    });

    allJoints().forEach(function (j) {
      if (!j.present) return;
      var p = posed[j.id];
      ctx.beginPath();
      ctx.arc(p.pinX, p.pinY, 7, 0, Math.PI * 2);
      ctx.fillStyle = (j.stiff || !j.live) ? "#b5684a" : "#7a9a6a";
      ctx.fill();
      if (j.site === "extra") {
        ctx.strokeStyle = "#c4a15a";
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
    });
  }

  function local(ev) {
    var r = canvas.getBoundingClientRect();
    var t = ev.changedTouches ? ev.changedTouches[0] : ev;
    return {
      x: (t.clientX - r.left) * (canvas.width / r.width),
      y: (t.clientY - r.top) * (canvas.height / r.height)
    };
  }

  function stiffen(j) {
    j.stiff = true;
    j.live = false;
    setNote(j.name + " locked", "Bend is stiff. Part stays on.");
    draw();
  }

  function restore(j) {
    j.stiff = false;
    j.live = true;
    setNote(j.name + " live", "Hinge restored. Drag the pin to bend it.");
    draw();
  }

  function addExtraOn(parent) {
    var id = "extra_" + extras.length + "_" + Date.now().toString(36);
    var half = parent.len * 0.5;
    var oldLen = parent.len;
    parent.len = half;
    var child = {
      id: id,
      name: "extra hinge on " + parent.name,
      site: "extra",
      parent: parent.id,
      rest: 0.4,
      min: -1.2,
      max: 1.4,
      len: oldLen - half,
      angle: parent.angle + 0.5,
      stiff: false,
      live: true,
      present: true
    };
    allJoints().forEach(function (o) {
      if (o.id !== id && o.parent === parent.id) o.parent = id;
    });
    extras.push(child);
    setNote("extra hinge", "Nature did not order this. Try will fold it wrong.");
    draw();
  }

  function onDown(ev) {
    if (trying) return;
    ev.preventDefault();
    canvas.setPointerCapture(ev.pointerId);
    var pt = local(ev);
    var posed = pose();
    var pin = hitPin(pt.x, pt.y, posed);

    if (mode === "pull") {
      if (pin) {
        pendingPull = { id: pin.id, x: pt.x, y: pt.y, moved: false };
        if (pin.live && !pin.stiff) drag = { id: pin.id };
      }
      return;
    }

    if (mode === "add") {
      if (pin && (pin.stiff || !pin.live)) {
        restore(pin);
        return;
      }
      var shaft = hitShaft(pt.x, pt.y, posed);
      if (shaft) {
        addExtraOn(shaft);
        return;
      }
      setNote("missed", "Tap a stiff pin to restore, or a bone shaft to add a hinge.");
      return;
    }

    if (pin && pin.live && !pin.stiff) drag = { id: pin.id };
  }

  function onMove(ev) {
    if (trying) return;
    var pt = local(ev);
    if (pendingPull) {
      var dx = pt.x - pendingPull.x, dy = pt.y - pendingPull.y;
      if (dx * dx + dy * dy > 25) pendingPull.moved = true;
    }
    if (!drag) return;
    ev.preventDefault();
    var j = byId(drag.id);
    if (!j || j.stiff || !j.live) return;
    var posed = pose();
    var p = posed[j.id];
    j.angle = clamp(Math.atan2(pt.y - p.pinY, pt.x - p.pinX), j.min, j.max);
    draw();
  }

  function onUp() {
    if (pendingPull && !pendingPull.moved) {
      var j = byId(pendingPull.id);
      if (j) stiffen(j);
    }
    pendingPull = null;
    drag = null;
  }

  function hardwareFacts(posed) {
    var facts = [];
    var stiffHips = joints.filter(function (j) { return j.id.indexOf("_hip") >= 0 && j.stiff; });
    var stiffKnees = joints.filter(function (j) { return j.id.indexOf("_knee") >= 0 && j.stiff; });
    var neck = byId("neck");
    var mid = byId("neck_mid");
    var head = byId("head");

    if (stiffHips.length) {
      facts.push("Stiff " + stiffHips.map(function (j) { return j.name.replace(" hip", ""); }).join("/") + " hip — hobble.");
    }
    if (animalId === "goat") {
      if (stiffKnees.length) facts.push("Shelf knee locked — stuck on the stair.");
      var stillFolded = joints.filter(function (j) {
        return j.id.indexOf("_knee") >= 0 && j.live && !j.stiff && j.angle < -0.2;
      }).length;
      if (stillFolded >= 2) facts.push("Knees still chair-folded — cannot climb to the leaf.");
    } else {
      if (stiffKnees.length >= 2) facts.push("Knees locked — drag.");
      else if (stiffKnees.length === 1) facts.push(stiffKnees[0].name + " stiff — limp.");
    }

    if (animalId === "heron") {
      if (mid && mid.stiff) facts.push("Mid neck stiff — mailbox poke / snapped yardstick.");
      else if (neck && neck.stiff) facts.push("Neck base locked — strike stays coiled.");
    } else if (neck && neck.stiff) {
      facts.push("Neck locked — mailbox poke.");
    }

    if (head && head.stiff && !(neck && neck.stiff)) facts.push("Skull latch stiff — aim stays wrong.");
    if (extras.length) facts.push("Extra hinge — folded in a stupid place.");
    if (head) {
      var hp = posed[head.id];
      if (hp.tipY > body.y + 24) facts.push("Head aimed at dirt — cannot take the leaf.");
    }
    return facts;
  }

  function headNearLeaf(posed) {
    var head = byId("head");
    if (!head) return false;
    var hp = posed[head.id];
    var dx = hp.tipX - LEAF.x;
    var dy = hp.tipY - LEAF.y;
    var r = animalId === "heron" ? 42 : 36;
    return dx * dx + dy * dy < r * r;
  }

  function kneesUnlocked() {
    return joints.filter(function (j) {
      return j.id.indexOf("_knee") >= 0 && j.live && !j.stiff && j.angle > 0.15;
    }).length >= 2;
  }

  function finishTry(reached, facts) {
    if (reached) {
      setNote("leaf got bitten", facts.join(" ") || "It worked. That does not mean the hinges are right.");
    } else if (!facts.length) {
      setNote("leaf still up there", "Took the steps. Missed the snack.");
    } else {
      setNote("try failed", facts.join(" "));
    }
  }

  function runTry() {
    if (trying) return;
    trying = true;
    btnTry.disabled = true;
    setNote("trying", animal().tryVerb);

    var start = {};
    allJoints().forEach(function (j) { start[j.id] = j.angle; });

    var t0 = performance.now();
    var DUR = animalId === "heron" ? 2200 : 2800;
    var reached = false;
    var early = hardwareFacts(pose());

    function frame(now) {
      var t = Math.min(1, (now - t0) / DUR);
      var walk, graze;
      if (animalId === "heron") {
        walk = Math.min(1, t / 0.35);
        graze = Math.max(0, (t - 0.35) / 0.65);
      } else {
        walk = Math.min(1, t / 0.55);
        graze = Math.max(0, (t - 0.55) / 0.45);
      }

      var stiffHipN = joints.filter(function (j) { return j.id.indexOf("_hip") >= 0 && j.stiff; }).length;
      var stiffKneeN = joints.filter(function (j) { return j.id.indexOf("_knee") >= 0 && j.stiff; }).length;
      var speed = (animalId === "goat" ? 48 : animalId === "heron" ? 55 : 70) - stiffHipN * 14 - stiffKneeN * 8 - extras.length * 10;
      if (animalId === "goat" && !kneesUnlocked()) speed = Math.min(speed, 18);
      if (speed < 6) speed = 6;

      var tip = 0;
      if (stiffHipN >= 2) tip = Math.sin(walk * Math.PI * 2) * 10;
      if (stiffHipN >= 3) tip += 6;
      if (animalId === "goat" && stiffKneeN) tip += Math.abs(Math.sin(walk * Math.PI * 6)) * 4;
      worldX = walk * speed;
      body.y = animal().body.y + tip + (stiffKneeN >= 3 ? 8 : 0);

      var gait = walk * Math.PI * (animalId === "goat" ? 6 : 4);
      ["fl_hip", "fr_hip", "bl_hip", "br_hip"].forEach(function (id) {
        var j = byId(id);
        if (j && j.live && !j.stiff) {
          var phase = id.charAt(0) === "f" ? 0 : Math.PI;
          var side = id.indexOf("l") >= 0 ? 1 : -1;
          j.angle = clamp(start[id] + Math.sin(gait + phase) * 0.28 * side, j.min, j.max);
        }
      });
      ["fl_knee", "fr_knee", "bl_knee", "br_knee"].forEach(function (id) {
        var j = byId(id);
        if (!j || !j.live || j.stiff) return;
        if (animalId === "goat") {
          // try to unfold shelves toward a usable walk
          var target = 0.55;
          j.angle = clamp(start[id] + (target - start[id]) * walk + Math.sin(gait + 0.5) * 0.15, j.min, j.max);
        } else {
          j.angle = clamp(start[id] + Math.sin(gait + 0.5) * 0.35, j.min, j.max);
        }
      });
      extras.forEach(function (e) {
        if (e.live && !e.stiff) {
          e.angle = clamp(start[e.id] + Math.sin(gait * 1.3) * 0.9, e.min, e.max);
        }
      });

      var neck = byId("neck");
      var mid = byId("neck_mid");
      var head = byId("head");
      if (graze > 0) {
        if (animalId === "heron") {
          // snap unfold toward leaf
          if (neck && neck.live && !neck.stiff) {
            neck.angle = clamp(start.neck + (-1.2 - start.neck) * graze, neck.min, neck.max);
          }
          if (mid && mid.live && !mid.stiff) {
            mid.angle = clamp(start.neck_mid + (-0.6 - start.neck_mid) * Math.min(1, graze * 1.4), mid.min, mid.max);
          } else if (mid && mid.stiff) {
            mid.angle = start.neck_mid + graze * 0.08;
          }
          if (head && head.live && !head.stiff) {
            var posedH = pose();
            var pinH = posedH.head;
            var wantH = Math.atan2(LEAF.y - pinH.pinY, LEAF.x - pinH.pinX);
            head.angle = clamp(start.head + (wantH - start.head) * graze, head.min, head.max);
          }
        } else {
          if (neck && neck.live && !neck.stiff) {
            var target = animalId === "goat" ? -1.55 : -2.05;
            neck.angle = clamp(start.neck + (target - start.neck) * graze, neck.min, neck.max);
          } else if (neck && neck.stiff) {
            neck.angle = start.neck + graze * 0.15;
          }
          if (head && head.live && !head.stiff) {
            var posed = pose();
            var pin = posed.head;
            var want = Math.atan2(LEAF.y - pin.pinY, LEAF.x - pin.pinX);
            head.angle = clamp(start.head + (want - start.head) * graze, head.min, head.max);
          }
        }
      }

      var posed = pose();
      var canReach = true;
      if (animalId === "goat" && !kneesUnlocked()) canReach = false;
      if (canReach && headNearLeaf(posed)) reached = true;
      draw();

      if (t < 1) {
        animId = requestAnimationFrame(frame);
      } else {
        allJoints().forEach(function (j) {
          if (j.live && !j.stiff) j.angle = start[j.id];
        });
        body.y = animal().body.y;
        trying = false;
        btnTry.disabled = false;
        animId = null;
        var late = hardwareFacts(pose());
        if (animalId === "goat" && !kneesUnlocked() && !reached) {
          late.push("Shelves never opened — leaf stays a rumor.");
        }
        var all = [];
        early.concat(late).forEach(function (f) {
          if (all.indexOf(f) < 0) all.push(f);
        });
        finishTry(reached, all);
        draw();
      }
    }
    animId = requestAnimationFrame(frame);
  }

  Object.keys(ANIMALS).forEach(function (id) {
    var b = document.createElement("button");
    b.textContent = ANIMALS[id].label;
    b.dataset.id = id;
    b.onclick = function () { selectAnimal(id); };
    animalsEl.appendChild(b);
  });

  canvas.addEventListener("pointerdown", onDown);
  canvas.addEventListener("pointermove", onMove);
  canvas.addEventListener("pointerup", onUp);
  canvas.addEventListener("pointercancel", onUp);

  btnPull.onclick = function () { if (!trying) setMode("pull"); };
  btnAdd.onclick = function () { if (!trying) setMode("add"); };
  btnTry.onclick = function () { runTry(); };
  btnReset.onclick = function () { if (!trying) resetAll(); };

  resetAll();
})();
  </script>
</body>
</html>
